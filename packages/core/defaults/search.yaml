# Operator-owned search config. sdd does not refresh this file.
# Keyword index is always on. Embeddings stay off until embeddings is true.
version: 1
provider: builtin
k: 20
embeddings: false
budgets:
  default: 12000
  intent: 4000
  clarify_intent: 4000
  brainstorm: 4000
  design: 8000
  clarify_design: 8000
  tasks: 8000
  clarify_tasks: 8000
  implement: 12000
  local_verify: 8000
exclude: []
