name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & typecheck (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm must be on PATH before setup-node cache / install
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          # v5 defaults to package-manager-cache:true which looks for pnpm too early
          package-manager-cache: false

      - name: Verify pnpm
        run: |
          command -v pnpm
          pnpm --version
          node --version

      - name: Install dependencies
        env:
          # Linux postinstall otherwise downloads optional CUDA binaries. A 504 fails the job.
          # The CPU runtime is already in the package. Tests do not use the GPU build.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (unit)
        run: pnpm test

      - name: Skill pack checks
        run: node --test skills/sdd-design-writer/scripts/check-design.test.mjs

      - name: CLI smoke (init → new → next → complete)
        run: bash scripts/cli-smoke.sh

      - name: Skill pack design examples
        run: node skills/sdd-design-writer/scripts/validate-examples.mjs

  npm-pack:
    name: npm pack (dry)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          package-manager-cache: false

      - name: Install & build
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pack packages
        run: |
          pnpm --filter @structured-vibe-coding/core exec npm pack --dry-run
          pnpm --filter @structured-vibe-coding/cli exec npm pack --dry-run
